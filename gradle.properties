# ---------------------------------------------------------------------------
#  Gradle 构建参数
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# 某些受限/沙箱环境下 Gradle 的原生文件监视器无法初始化（thread error 5），关掉它。
org.gradle.vfs.watch=false

# JDK 21.0.12 的 javac 在重编译 NeoForm 反编译产物时会失败：
#   "ERROR Line: 1, ...world.ticks.package-info...: null in .../package-info.java"
#   -> java.io.IOException: Compilation failed
# 换用 NeoForm 自带的 Eclipse 编译器（ECJ）即可绕过。
neoForge.neoFormRuntime.useEclipseCompiler=true

# ---------------------------------------------------------------------------
#  模组元数据
#
#  ！！这里只能写 ASCII ！！
#  Gradle 以 ISO-8859-1 读取 gradle.properties，中文字面量会变成乱码。
#  模组的显示名与简介请直接写在 src/main/resources/META-INF/neoforge.mods.toml 里。
# ---------------------------------------------------------------------------
mod_id=betterluck
mod_name=Better Luck Effect
mod_license=LGPL-3.0-only
mod_version=1.06
mod_group_id=io.github.orangeegg123123.betterluck
mod_authors=OrangeEgg123123

# ---------------------------------------------------------------------------
#  Minecraft / NeoForge 版本
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.209
neo_version_range=[21.1.0,)
loader_version_range=[4,)
